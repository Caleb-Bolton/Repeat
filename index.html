<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repeat — Voice Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d29;
      --accent: #5b8cff;
      --accent-2: #ff5b8c;
      --text: #e8eaf0;
      --muted: #8a90a6;
      --ok: #3ddc84;
      --phase: #8a90a6;
      --phase-glow: rgba(138,144,166,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 50% 18%, var(--phase-glow), transparent 70%),
        radial-gradient(1200px 600px at 50% -10%, #1c2233, var(--bg));
      color: var(--text);
      font-family: "Outfit", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.45s ease;
    }
    body[data-phase="listening"] {
      --phase: var(--ok);
      --phase-glow: rgba(61,220,132,0.18);
    }
    body[data-phase="recording"] {
      --phase: var(--accent-2);
      --phase-glow: rgba(255,91,140,0.20);
    }
    body[data-phase="playing"] {
      --phase: var(--accent);
      --phase-glow: rgba(91,140,255,0.20);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, #1d2130, var(--panel));
      border: 1px solid #272b3b;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .brand { margin-bottom: 22px; }
    .brand__row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .brand__mark {
      width: 34px;
      height: 34px;
      flex: none;
      color: var(--accent);
      filter: drop-shadow(0 0 12px rgba(91,140,255,0.35));
    }
    .brand__mark path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      margin: 0;
      font-family: inherit;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    p.sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    /* Phase ring — primary status + meter surface */
    .phase {
      position: relative;
      width: min(100%, 260px);
      aspect-ratio: 1;
      margin: 0 auto 22px;
      color: var(--phase);
      transition: color 0.4s ease, filter 0.4s ease;
    }
    .phase__svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }
    .phase__track {
      fill: none;
      stroke: #272b3b;
      stroke-width: 6;
    }
    .phase__progress {
      fill: none;
      stroke: currentColor;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 326.73;
      stroke-dashoffset: 326.73;
      transition: stroke 0.35s ease;
      filter: drop-shadow(0 0 10px color-mix(in srgb, currentColor 45%, transparent));
    }
    .phase__silence {
      fill: none;
      stroke: rgba(255,255,255,0.45);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 326.73;
      stroke-dashoffset: 326.73;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .phase__threshold {
      opacity: 0.9;
    }
    .phase__threshold-tick {
      stroke: #c5cad8;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .phase.playing .phase__threshold,
    .phase.idle .phase__threshold {
      opacity: 0;
    }
    .phase__core {
      position: absolute;
      inset: 18%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--phase) 16%, transparent), transparent 68%),
        #12141d;
      box-shadow: inset 0 0 0 1px #272b3b;
      overflow: hidden;
      transition: transform 0.08s ease, background 0.4s ease, box-shadow 0.4s ease;
    }
    .phase__wave {
      position: absolute;
      inset: 10%;
      width: 80%;
      height: 80%;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .phase.listening .phase__wave,
    .phase.recording .phase__wave {
      opacity: 1;
    }
    .phase__bloom {
      position: absolute;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--phase) 55%, white), transparent 72%);
      opacity: 0.35;
      transform: scale(0.18);
      transition: transform 0.06s linear, opacity 0.35s ease;
      pointer-events: none;
    }
    .phase.listening .phase__bloom,
    .phase.recording .phase__bloom { opacity: 0.18; }
    .phase.recording .phase__bloom { animation: bloomPulse 1.1s ease-in-out infinite; }
    .phase.playing .phase__bloom {
      opacity: 0.4;
      transform: scale(0.55);
      animation: none;
    }
    .phase.idle .phase__bloom {
      opacity: 0.2;
      transform: scale(0.18);
      animation: none;
    }
    @keyframes bloomPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.35); }
    }
    .phase.listening { animation: ringBreathe 2.8s ease-in-out infinite; }
    .phase.recording .phase__progress { animation: ringPulse 1s ease-in-out infinite; }
    @keyframes ringBreathe {
      0%, 100% { filter: drop-shadow(0 0 0 transparent); }
      50% { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--ok) 35%, transparent)); }
    }
    @keyframes ringPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    .phase__icon {
      position: relative;
      z-index: 1;
      width: 36px;
      height: 36px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .phase__icon:empty {
      display: none;
    }
    .phase__icon.is-entering {
      animation: iconIn 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes iconIn {
      from { opacity: 0; transform: scale(0.82); }
      to { opacity: 1; transform: scale(1); }
    }
    .phase__icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .phase__icon svg.filled {
      fill: currentColor;
      stroke: none;
    }
    /* Play triangles read right-heavy; nudge for optical center */
    .phase__icon svg.play-icon {
      transform: translateX(-1px);
    }
    .phase.recording .phase__icon,
    .phase.listening .phase__icon {
      color: var(--phase);
    }
    .phase.playing .phase__icon {
      color: var(--accent);
    }
    .phase.is-playback {
      cursor: pointer;
    }
    .phase.is-playback:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
      border-radius: 50%;
    }
    .phase.is-playback:active .phase__core {
      transform: scale(0.98);
    }
    .phase__meta {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      transform: translate(-50%, 22px);
      width: max-content;
      max-width: 88%;
      margin: 0;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
      pointer-events: none;
    }
    .phase__meta:empty { display: none; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 0;
      transition: margin-bottom 0.3s ease;
    }
    .card.has-history .controls {
      margin-bottom: 22px;
    }
    button {
      border: none;
      cursor: pointer;
      transition: transform 0.05s, opacity 0.2s, background 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Single session toggle: starts / stops the whole loop. */
    .session-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
    }
    .session-btn .session-btn__icon { font-size: 14px; line-height: 1; }
    .session-btn.running {
      background: #2a2f42;
      color: var(--text);
    }

    .settings-btn {
      flex: none;
      width: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #2a2f42;
      color: var(--text);
      font-size: 18px;
      position: relative;
    }
    .settings-btn__icon {
      width: 24px;
      height: 24px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .settings-btn__icon--settings {
      width: 25px;
      height: 25px;
    }
    .settings-btn.open {
      background: rgba(91,140,255,0.18);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91,140,255,0.45);
    }
    .settings-btn.live::after {
      content: '';
      position: absolute;
      top: 10px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 2px #2a2f42;
    }

    .settings {
      display: none;
      grid-gap: 12px;
      margin-bottom: 4px;
    }
    .settings.open {
      display: grid;
      margin-top: 14px;
    }
    .settings-group {
      display: grid;
      gap: 12px;
      padding: 12px;
      background: #11131c;
      border: 1px solid #272b3b;
      border-radius: 12px;
    }
    .settings-group__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 28px;
    }
    .settings-group__title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .settings-group__actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row { display: grid; gap: 6px; }
    .row label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .row label b { color: var(--text); font-weight: 600; flex: none; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .audio-mode {
      display: grid;
      gap: 8px;
      margin: 2px 0 0;
      padding: 12px 0 0;
      border-top: 1px solid #272b3b;
    }
    .audio-mode__label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .audio-mode__options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .audio-mode__option {
      position: relative;
      min-width: 0;
    }
    .audio-mode__option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .audio-mode__option span {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 9px 10px;
      border-radius: 9px;
      background: #2a2f42;
      color: var(--muted);
      box-shadow: inset 0 0 0 1px #3a4158;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .audio-mode__option svg {
      width: 17px;
      height: 17px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .audio-mode__option input:checked + span {
      background: rgba(91,140,255,0.12);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91,140,255,0.4);
    }
    .audio-mode__option input:focus-visible + span {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .audio-mode__help {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .metro-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      background: #2a2f42;
      color: var(--text);
      box-shadow: inset 0 0 0 1px #3a4158;
    }
    .metro-toggle.on {
      background: rgba(91,140,255,0.12);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91,140,255,0.4);
    }
    .metro-toggle__icon {
      font-size: 12px;
      line-height: 1;
      width: 1em;
      text-align: center;
    }
    .metro-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .metro-head__title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metro__beat {
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2a2f42;
      box-shadow: inset 0 0 0 1px #3a4158;
      transition: background 0.05s, box-shadow 0.05s;
    }
    .metro__beat.flash {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(91,140,255,0.25);
    }
    .metro__beat.flash.accent {
      background: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(255,91,140,0.25);
    }

    .history {
      margin-top: 24px;
      border-top: 1px solid #272b3b;
      padding-top: 18px;
      animation: historyIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .history[hidden] { display: none !important; }
    @keyframes historyIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .history__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .history__head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .history__head span { color: var(--muted); font-size: 12px; }
    .menu {
      position: relative;
      flex: none;
    }
    .menu-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      background: #2a2f42;
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-btn.open {
      background: rgba(91,140,255,0.18);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91,140,255,0.45);
    }
    .menu__dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 148px;
      padding: 6px;
      background: #1a1d29;
      border: 1px solid #272b3b;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      z-index: 20;
      display: none;
    }
    .menu__dropdown.open { display: block; }
    .menu__item {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }
    .menu__item:hover:not(:disabled) {
      background: #2a2f42;
    }
    .menu__item.on {
      color: var(--accent);
      background: rgba(91,140,255,0.12);
    }
    .menu__item.danger {
      color: var(--accent-2);
    }
    .menu__item:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .dialog {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .dialog[hidden] { display: none; }
    .dialog__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }
    .dialog__card {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 20px;
      background: #1a1d29;
      border: 1px solid #272b3b;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .dialog__msg {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }
    .dialog__actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .dialog__btn {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #2a2f42;
      color: var(--text);
    }
    .dialog__btn.danger {
      background: rgba(255,91,140,0.18);
      color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(255,91,140,0.35);
    }
    .history__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }
    .history__empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 12px 0;
    }
    .clip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #11131c;
      border: 1px solid #272b3b;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .clip.clip--enter {
      animation: clipIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes clipIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .clip.playing { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,140,255,0.2); }
    .clip.starred { border-color: rgba(255,196,77,0.45); }
    .clip.selecting { cursor: pointer; }
    .clip.selected {
      border-color: var(--accent);
      background: rgba(91,140,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(91,140,255,0.18);
    }
    .clip__play {
      flex: none;
      width: 34px; height: 34px;
      padding: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip__select {
      flex: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid #3a4158;
      background: #1b1f2d;
      color: transparent;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip.selected .clip__select {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .clip__keeper-mark {
      flex: none;
      width: 32px;
      text-align: center;
      color: #ffc44d;
      font-size: 16px;
    }
    .clip__meta { flex: 1; min-width: 0; }
    .clip__title {
      width: fit-content;
      max-width: 100%;
      font-size: 13px;
      font-weight: 600;
      cursor: text;
      border-radius: 4px;
      padding: 1px 2px;
      margin: -1px -2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clip__title:hover { background: rgba(255,255,255,0.05); }
    .clip__sub { font-size: 11px; color: var(--muted); }
    .clip__rename {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      margin: 0;
      padding: 4px 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: #0f1117;
      border: 1px solid var(--accent);
      border-radius: 6px;
      outline: none;
    }
    .clip--renaming .clip__sub { display: none; }
    .clip--renaming .clip__actions { display: none; }
    .clip__btn {
      flex: none;
      width: 32px; height: 32px;
      padding: 0;
      border-radius: 8px;
      background: #2a2f42;
      color: var(--text);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .clip__btn svg {
      width: 15px;
      height: 15px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .clip__btn.primary {
      background: var(--accent);
      color: #fff;
    }
    .clip__btn.primary.star.on {
      color: #ffc44d;
      background: rgba(255,196,77,0.18);
      box-shadow: inset 0 0 0 1px rgba(255,196,77,0.35);
    }
    .clip__btn.archive.on {
      color: var(--accent);
      background: rgba(91,140,255,0.12);
    }
    .clip__btn.danger:hover {
      color: var(--accent-2);

  <script>
    const sessionBtn = document.getElementById('sessionBtn');
    const sessionIcon = document.getElementById('sessionIcon');
    const sessionLabel = document.getElementById('sessionLabel');
    const phaseEl = document.getElementById('phase');
    const phaseIcon = document.getElementById('phaseIcon');
    const phaseMeta = document.getElementById('phaseMeta');
    const phaseProgress = document.getElementById('phaseProgress');
    const phaseSilence = document.getElementById('phaseSilence');
    const phaseThreshold = document.getElementById('phaseThreshold');
    const phaseBloom = document.getElementById('phaseBloom');
    const phaseWave = document.getElementById('phaseWave');
    const historySection = document.getElementById('historySection');
    const cardEl = document.querySelector('.card');
    const PHASE_C = 2 * Math.PI * 52;
    const waveCtx = phaseWave.getContext('2d');
    let silenceDisplayPct = 0;
    let pendingEnterId = null;
    let phaseIconAnimTimer = null;
    const threshSlider = document.getElementById('thresh');
    const durSlider = document.getElementById('dur');
    const threshVal = document.getElementById('threshVal');
    const durVal = document.getElementById('durVal');
    const audioModeInputs = Array.from(document.querySelectorAll('input[name="audioMode"]'));
    const audioModeHelp = document.getElementById('audioModeHelp');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const historyCount = document.getElementById('historyCount');
    const historyTitle = document.getElementById('historyTitle');
    const selectModeBtn = document.getElementById('selectModeBtn');
    const selectionHead = document.getElementById('selectionHead');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const bulkBar = document.getElementById('bulkBar');
    const selectedCount = document.getElementById('selectedCount');
    const bulkArchiveBtn = document.getElementById('bulkArchiveBtn');
    const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
    const menuBtn = document.getElementById('menuBtn');
    const menuDropdown = document.getElementById('menuDropdown');
    const confirmDialog = document.getElementById('confirmDialog');
    const confirmMsg = document.getElementById('confirmMsg');
    const confirmOk = document.getElementById('confirmOk');
    const confirmCancel = document.getElementById('confirmCancel');
    const confirmBackdrop = document.getElementById('confirmBackdrop');
    const keepersBtn = document.getElementById('keepersBtn');
    const archivedBtn = document.getElementById('archivedBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const metroPanelBtn = document.getElementById('metroPanelBtn');
    const metroPanel = document.getElementById('metroPanel');
    const metroBtn = document.getElementById('metroBtn');
    const metroBeat = document.getElementById('metroBeat');
    const metroIcon = document.getElementById('metroIcon');
    const metroLabel = document.getElementById('metroLabel');
    const bpmSlider = document.getElementById('bpm');
    const bpmVal = document.getElementById('bpmVal');
    const beatsSlider = document.getElementById('beats');
    const beatsVal = document.getElementById('beatsVal');

    const DB_NAME = 'repeat';
    const DB_VERSION = 1;
    const LEGACY_HISTORY_KEY = 'repeat-history';
    const LEGACY_METRO_KEY = 'repeat-metronome';
    const SETTINGS_KEY = 'repeat-settings';
    const ARCHIVED_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

    let audioCtx, analyser, sourceNode, micStream;
    let mediaRecorder, chunks = [];
    let rafId = null;
    let running = false;
    let recording = false;
    let armed = false;            // listening for speech, recorder not started yet
    let recordingFinalized = true;

    // Silence-detection state
    let hasSpoken = false;        // did we hear sound during this take?
    let silenceStart = null;      // timestamp when silence began
    let recordStartTime = 0;      // when the current take began

    // Recording history
    const history = [];           // { id, url, blob, duration, time, ext, type, starred, archived, archivedAt, name }
    let takeNum = 0;
    let nowPlayingEl = null;
    let historyAudio = null;
    let historyFilter = 'active'; // 'active' | 'keepers' | 'archived'
    let historySelecting = false;
    const selectedTakeIds = new Set();
    let dbPromise = null;
    let sessionStopPromise = null;
    let historyPlayRequest = 0;
    const pendingTakeSaves = new Set();

    // Auto (loop) playback
    let loopAudio = null;
    let loopUrl = null;
    let loopProgressRaf = null;
    let loopMeasuredDuration = 0;

    // Metronome
    let metroCtx = null;
    let metroTimer = null;
    let metroOn = false;
    let metroBeatIndex = 0;
    let metroNextTime = 0;
    let metroResumeAfterPlayback = false; // auto-paused for loop playback; resume when it ends

    function setPanelOpen(panel, btn, open) {
      panel.classList.toggle('open', open);
      panel.hidden = !open;
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    }

    function closePanels() {
      setPanelOpen(settingsPanel, settingsBtn, false);
      setPanelOpen(metroPanel, metroPanelBtn, false);
    }

    settingsBtn.addEventListener('click', () => {
      const open = settingsPanel.hidden;
      closePanels();
      if (open) setPanelOpen(settingsPanel, settingsBtn, true);
    });

    metroPanelBtn.addEventListener('click', () => {
      const open = metroPanel.hidden;
      closePanels();
      if (open) setPanelOpen(metroPanel, metroPanelBtn, true);
    });

    function idbRequest(req) {
      return new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('clips')) {
            db.createObjectStore('clips', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('meta')) {
            db.createObjectStore('meta', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function getDB() {
      if (!dbPromise) dbPromise = openDB();
      return dbPromise;
    }

    async function metaGet(key) {
      const db = await getDB();
      const row = await idbRequest(db.transaction('meta').objectStore('meta').get(key));
      return row ? row.value : undefined;
    }

    async function metaSet(key, value) {
      const db = await getDB();
      await idbRequest(
        db.transaction('meta', 'readwrite').objectStore('meta').put({ key, value })
      );
    }

    async function saveClip(item) {
      const db = await getDB();
      const record = {
        id: item.id,
        n: item.n,
        name: item.name || '',
        blob: item.blob,
        duration: item.duration,
        time: item.time instanceof Date ? item.time.toISOString() : item.time,
        ext: item.ext,
        type: item.type,
        starred: !!item.starred,
        archived: !!item.archived,
        archivedAt: item.archived
          ? (item.archivedAt instanceof Date
              ? item.archivedAt.toISOString()
              : (item.archivedAt || null))
          : null,
      };
      await idbRequest(
        db.transaction('clips', 'readwrite').objectStore('clips').put(record)
      );
    }

    async function deleteClip(id) {
      const db = await getDB();
      await idbRequest(
        db.transaction('clips', 'readwrite').objectStore('clips').delete(id)
      );
    }

    async function loadAllClips() {
      const db = await getDB();
      return idbRequest(db.transaction('clips').objectStore('clips').getAll());
    }

    function base64ToBlob(b64, type) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: type || 'audio/webm' });
    }

    async function migrateFromLocalStorage() {
      const raw = localStorage.getItem(LEGACY_HISTORY_KEY);
      if (raw) {
        try {
          const payload = JSON.parse(raw);
          const items = Array.isArray(payload.items) ? payload.items : [];
          for (const saved of items) {
            if (!saved || !saved.data) continue;
            const type = saved.type || 'audio/webm';
            await saveClip({
              id: saved.id,
              n: saved.n,
              name: saved.name || '',
              blob: base64ToBlob(saved.data, type),
              duration: Number(saved.duration) || 0,
              time: saved.time,
              ext: saved.ext || 'webm',
              type,
              starred: !!saved.starred,
            });
          }
          if (payload.takeNum != null) {
            await metaSet('takeNum', Number(payload.takeNum) || 0);
          }
        } catch (err) {
          console.warn('Could not migrate history from localStorage', err);
        }
        localStorage.removeItem(LEGACY_HISTORY_KEY);
      }

      const metroRaw = localStorage.getItem(LEGACY_METRO_KEY);
      if (metroRaw) {
        try {
          await metaSet('metronome', JSON.parse(metroRaw));
        } catch (err) {
          console.warn('Could not migrate metronome prefs', err);
        }
        localStorage.removeItem(LEGACY_METRO_KEY);
      }
    }

    async function persistTakeNum() {
      try {
        await metaSet('takeNum', takeNum);
      } catch (err) {
        console.warn('Could not save take number', err);
      }
    }

    async function persistMetroPrefs() {
      try {
        await metaSet('metronome', {
          bpm: Number(bpmSlider.value),
          beats: Number(beatsSlider.value),
        });
      } catch (err) {
        console.warn('Could not save metronome prefs', err);
      }
    }

    async function loadMetroPrefs() {
      try {
        const prefs = await metaGet('metronome');
        if (!prefs) return;
        if (prefs.bpm) bpmSlider.value = prefs.bpm;
        if (prefs.beats) beatsSlider.value = prefs.beats;
      } catch (_) {}
    }

    async function loadHistory() {
      const records = await loadAllClips();
      records.sort((a, b) => (b.n || 0) - (a.n || 0));
      history.length = 0;
      records.forEach(saved => {
        if (!saved || !saved.blob) return;
        history.push({
          id: saved.id,
          n: saved.n,
          name: saved.name || '',
          url: URL.createObjectURL(saved.blob),
          blob: saved.blob,
          duration: Number(saved.duration) || 0,
          time: new Date(saved.time),
          ext: saved.ext || 'webm',
          type: saved.type || saved.blob.type || 'audio/webm',
          starred: !!saved.starred,
          archived: !!saved.archived,
          archivedAt: saved.archivedAt ? new Date(saved.archivedAt) : null,
        });
      });
      const storedTake = await metaGet('takeNum');
      takeNum = Number(storedTake) || history.reduce((m, i) => Math.max(m, i.n || 0), 0);
    }

    function clipAgeMs(item, now = Date.now()) {
      const stamp = item.archivedAt || item.time;
      const t = stamp instanceof Date ? stamp.getTime() : Date.parse(stamp);
      return Number.isFinite(t) ? now - t : 0;
    }

    async function purgeExpiredArchived() {
      const now = Date.now();
      const expired = history.filter(
        item => item.archived && clipAgeMs(item, now) >= ARCHIVED_RETENTION_MS
      );
      if (expired.length === 0) return;

      for (const item of expired) {
        if (historyAudio && nowPlayingEl && nowPlayingEl.dataset.id === item.id) {
          stopHistoryPlayback();
        }
        URL.revokeObjectURL(item.url);
        const idx = history.findIndex(h => h.id === item.id);
        if (idx >= 0) history.splice(idx, 1);
      }
      if (history.length === 0) takeNum = 0;

      try {
        await Promise.all(expired.map(item => deleteClip(item.id)));
        await persistTakeNum();
      } catch (err) {
        console.warn('Could not purge expired archived takes', err);
      }
    }

    async function initStorage() {
      try {
        await getDB();
        await migrateFromLocalStorage();
        await loadHistory();
        await purgeExpiredArchived();
        await loadMetroPrefs();
      } catch (err) {
        console.warn('Could not initialize IndexedDB storage', err);
      }
      bpmVal.textContent = bpmSlider.value + ' BPM';
      beatsVal.textContent = beatsSlider.value;
      renderHistory();
    }

    function ensureMetroCtx() {
      if (!metroCtx || metroCtx.state === 'closed') {
        metroCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (metroCtx.state === 'suspended') metroCtx.resume();
      return metroCtx;
    }

    function scheduleMetroClick(when, accent) {
      const ctx = ensureMetroCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = accent ? 1200 : 900;
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.28 : 0.14, when + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + 0.06);
    }

    function flashMetroBeat(accent) {
      metroBeat.classList.remove('flash', 'accent');
      void metroBeat.offsetWidth;
      metroBeat.classList.add('flash');
      if (accent) metroBeat.classList.add('accent');
      clearTimeout(flashMetroBeat._t);
      flashMetroBeat._t = setTimeout(() => {
        metroBeat.classList.remove('flash', 'accent');
      }, 90);
    }

    function metroTick() {
      if (!metroOn) return;
      const ctx = ensureMetroCtx();
      const bpm = Number(bpmSlider.value) || 120;
      const interval = 60 / bpm;
      const beats = Number(beatsSlider.value) || 4;

      while (metroNextTime < ctx.currentTime + 0.1) {
        const accent = metroBeatIndex % beats === 0;
        const when = metroNextTime;
        scheduleMetroClick(when, accent);
        const delayMs = Math.max(0, (when - ctx.currentTime) * 1000);
        setTimeout(() => { if (metroOn) flashMetroBeat(accent); }, delayMs);
        metroNextTime += interval;
        metroBeatIndex++;
      }
      metroTimer = setTimeout(metroTick, 25);
    }

    function startMetronome() {
      const ctx = ensureMetroCtx();
      metroOn = true;
      metroBeatIndex = 0;
      metroNextTime = ctx.currentTime + 0.05;

      metroBtn.setAttribute('aria-pressed', 'true');
      metroIcon.textContent = '■';
      metroLabel.textContent = 'Pause';
      metroPanelBtn.classList.add('live');

      metroTick();

    function setPhaseProgress(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0)) / 100;
      phaseProgress.style.strokeDashoffset = String(PHASE_C * (1 - p));
    }

    function setSilenceProgress(pct) {
      if (pct == null || pct < 0) {
        silenceDisplayPct = 0;
        phaseSilence.style.opacity = '0';
        phaseSilence.style.strokeDashoffset = String(PHASE_C);
        return;
      }
      // Soft-follow the silence window so the arc eases instead of jumping.
      const target = Math.max(0, Math.min(100, pct));
      silenceDisplayPct += (target - silenceDisplayPct) * 0.22;
      if (Math.abs(target - silenceDisplayPct) < 0.15) silenceDisplayPct = target;
      const p = silenceDisplayPct / 100;
      phaseSilence.style.opacity = '1';
      phaseSilence.style.strokeDashoffset = String(PHASE_C * p);
    }

    function clearWaveform() {
      const dpr = window.devicePixelRatio || 1;
      const w = phaseWave.clientWidth || 160;
      const h = phaseWave.clientHeight || 160;
      if (phaseWave.width !== Math.floor(w * dpr) || phaseWave.height !== Math.floor(h * dpr)) {
        phaseWave.width = Math.floor(w * dpr);
        phaseWave.height = Math.floor(h * dpr);
      }
      waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      waveCtx.clearRect(0, 0, w, h);
    }

    function drawWaveform(data) {
      const dpr = window.devicePixelRatio || 1;
      const w = phaseWave.clientWidth || 160;
      const h = phaseWave.clientHeight || 160;
      if (phaseWave.width !== Math.floor(w * dpr) || phaseWave.height !== Math.floor(h * dpr)) {
        phaseWave.width = Math.floor(w * dpr);
        phaseWave.height = Math.floor(h * dpr);
      }
      waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      waveCtx.clearRect(0, 0, w, h);

      const color = getComputedStyle(phaseEl).color || '#8a90a6';
      // Classic bar chart: left = bass, right = treble (log-spaced bands).
      const bars = 14;
      const gap = 3.5;
      const padX = 10;
      const baseline = h * 0.72;
      const maxH = baseline * 0.85;
      const innerW = w - padX * 2;
      const barW = Math.max(4, (innerW - gap * (bars - 1)) / bars);
      const levels = new Array(bars).fill(0);

      if (analyser && audioCtx) {
        const freq = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(freq);
        const sampleRate = audioCtx.sampleRate || 44100;
        const binHz = sampleRate / analyser.fftSize;
        const minFreq = 80;   // bass floor
        const maxFreq = Math.min(10000, sampleRate * 0.45); // treble ceiling

        for (let i = 0; i < bars; i++) {
          // Logarithmic bands so each bar is an equal musical slice.
          const f0 = minFreq * Math.pow(maxFreq / minFreq, i / bars);
          const f1 = minFreq * Math.pow(maxFreq / minFreq, (i + 1) / bars);
          let i0 = Math.floor(f0 / binHz);
          let i1 = Math.ceil(f1 / binHz);
          i0 = Math.max(0, Math.min(freq.length - 1, i0));
          i1 = Math.max(i0 + 1, Math.min(freq.length, i1));

          let peak = 0;
          for (let j = i0; j < i1; j++) {
            if (freq[j] > peak) peak = freq[j];
          }
          // Slight lift on higher bands — treble energy is usually quieter.
          const trebleLift = 1 + (i / (bars - 1)) * 0.35;
          levels[i] = Math.min(1, (peak / 255) * trebleLift);
        }
      } else {
        // Fallback: no analyser — approximate from time-domain chunks.
        const chunk = Math.max(1, Math.floor(data.length / bars));
        for (let i = 0; i < bars; i++) {
          let peak = 0;
          const start = i * chunk;
          for (let j = 0; j < chunk; j++) {
            peak = Math.max(peak, Math.abs((data[start + j] - 128) / 128));
          }
          levels[i] = Math.min(1, peak * 1.4);
        }
      }

      waveCtx.fillStyle = color;
      waveCtx.globalAlpha = 0.92;
      for (let i = 0; i < bars; i++) {
        const amp = Math.max(0.08, levels[i]);
        const barH = Math.max(4, amp * maxH);
        const x = padX + i * (barW + gap);
        const y = baseline - barH;
        const r = Math.min(barW / 2, 2);
        waveCtx.beginPath();
        waveCtx.moveTo(x + r, y);
        waveCtx.arcTo(x + barW, y, x + barW, y + barH, r);
        waveCtx.lineTo(x + barW, y + barH);
        waveCtx.lineTo(x, y + barH);
        waveCtx.arcTo(x, y, x + barW, y, r);
        waveCtx.closePath();
        waveCtx.fill();
      }
      waveCtx.globalAlpha = 1;
    }

    function setPhaseBloom(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0)) / 100;
      phaseBloom.style.transform = 'scale(' + (0.18 + p * 0.85).toFixed(3) + ')';
    }

    function setPhaseMeta(text) {
      phaseMeta.textContent = text || '';
    }

    function resetPhaseVisual() {
      setPhaseProgress(0);
      setSilenceProgress(-1);
      setPhaseBloom(0);
      setPhaseMeta('');
      clearWaveform();
    }

    function updateThresholdTick() {
      const deg = (Number(threshSlider.value) / 100) * 360;
      phaseThreshold.setAttribute('transform', 'rotate(' + deg + ' 60 60)');
    }

    function setPhasePlaybackInteractive(on) {
      phaseEl.classList.toggle('is-playback', on);
      phaseEl.tabIndex = on ? 0 : -1;
      if (on) phaseEl.setAttribute('role', 'button');
      else phaseEl.removeAttribute('role');
    }

    function setStatus(state) {
      const ui = PHASE_UI[state] || PHASE_UI.idle;
      const visualState = state === 'blocked' ? 'idle'
        : state === 'history' ? 'playing'
        : state;

      phaseEl.className = 'phase ' + visualState;
      document.body.dataset.phase = visualState;
      phaseIcon.innerHTML = ui.icon;
      phaseIcon.classList.remove('is-entering');
      void phaseIcon.offsetWidth;
      phaseIcon.classList.add('is-entering');
      clearTimeout(phaseIconAnimTimer);
      phaseIconAnimTimer = setTimeout(() => phaseIcon.classList.remove('is-entering'), 360);

      const canSkipPlayback = state === 'playing';
      setPhasePlaybackInteractive(canSkipPlayback);
      if (!(state === 'listening' || state === 'recording')) clearWaveform();
      if (state === 'playing') {
        phaseEl.setAttribute('aria-label', 'Playing, click to skip');
        phaseEl.title = 'Click to skip';
      } else {
        phaseEl.setAttribute('aria-label', ui.label);
        phaseEl.removeAttribute('title');
      }

      if (visualState === 'idle') resetPhaseVisual();
      if (visualState === 'listening') setSilenceProgress(-1);
      if (visualState === 'playing') {
        setSilenceProgress(-1);
        setPhaseBloom(55);
      }
      if (state !== 'playing') {
        setPhaseMeta('');
      }
    }

    function persistSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          thresh: Number(threshSlider.value),
          dur: Number(durSlider.value),
          audioMode: selectedAudioMode(),
        }));
      } catch (err) {
        console.warn('Could not save settings', err);
      }
    }

    function loadSettings() {

        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
          const prefs = JSON.parse(raw);

    function selectedAudioMode() {

      return selected ? selected.value : 'music';

    function updateAudioModeHelp() {
      audioModeHelp.textContent = selectedAudioMode() === 'speech'
        ? 'Reduces background noise and speaker echo, with more consistent voice levels. Changes during an active session apply after the current take.'
        : 'Natural, unprocessed sound. Use headphones with the metronome to prevent click bleed. Changes during an active session apply after the current take.';

      threshVal.textContent = threshSlider.value + '%';
      updateThresholdTick();

    durSlider.addEventListener('input', () => {

      persistSettings();

    audioModeInputs.forEach(input => {
      input.addEventListener('change', () => {
        updateAudioModeHelp();
        persistSettings();
      });
    });
    loadSettings();
    phaseProgress.style.strokeDasharray = String(PHASE_C);
    phaseSilence.style.strokeDasharray = String(PHASE_C);

    sessionBtn.addEventListener('click', async () => {
      if (running || sessionStopPromise) await stop();
      else await start();
    });

    async function start() {
      if (sessionStopPromise) await sessionStopPromise;
      historyPlayRequest++;
      stopHistoryPlayback();

      try {
        await openCapture();
      } catch (err) {
        setStatus('blocked');
        return;
      }

      running = true;
      sessionBtn.classList.add('running');
      sessionIcon.textContent = '■';
      sessionLabel.textContent = 'Stop session';

      beginRecording();
      monitor();
    }

    async function openCapture() {
      const speechMode = selectedAudioMode() === 'speech';
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: speechMode,
          noiseSuppression: speechMode,
          autoGainControl: speechMode,
        },
      });
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const context = new AudioContextClass();
      const source = context.createMediaStreamSource(stream);
      const nextAnalyser = context.createAnalyser();
      nextAnalyser.fftSize = 2048;
      nextAnalyser.smoothingTimeConstant = 0.65;
      source.connect(nextAnalyser);

      micStream = stream;
      audioCtx = context;
      sourceNode = source;
      analyser = nextAnalyser;
    }

    function stop(options = {}) {
      if (sessionStopPromise) return sessionStopPromise;
      sessionStopPromise = stopSession(options).finally(() => {
        sessionStopPromise = null;
      });
      return sessionStopPromise;
    }

    async function stopSession({ pauseMetronome = true } = {}) {
      const recorder = mediaRecorder;
      const hasUnsavedRecording = recorder && !recordingFinalized;
      running = false;
      armed = false;
      recording = false;
      if (rafId) cancelAnimationFrame(rafId);

      if (pauseMetronome) {
        metroResumeAfterPlayback = false;
        stopMetronome();
      }
      stopLoopPlayback({ resumeListening: false, resumeMetronome: false });
      stopHistoryPlayback({ resumeMetronome: false });

      sessionBtn.classList.remove('running');
      sessionIcon.textContent = '▶';
      sessionLabel.textContent = 'Start session';
      resetPhaseVisual();
      setStatus('idle');

      if (hasUnsavedRecording) {
        // Finalize and persist the in-progress take before tearing down the mic.
        await new Promise(resolve => {
          recorder.onstop = async () => {
            recordingFinalized = true;
            try {
              await saveCurrentTake(recorder);
            } finally {
              resolve();
            }
          };
          if (recorder.state === 'recording') {
            try {
              recorder.stop();
            } catch (err) {
              recordingFinalized = true;
              resolve();
            }
          }
        });
      } else {
        if (recorder && recorder.state !== 'inactive') {
          recorder.onstop = null;
          try { recorder.stop(); } catch (_) {}
        }
      }

      // A completed take may still be writing to IndexedDB during loop playback.
      await waitForPendingTakeSaves();
      await teardownMedia();
    }

    async function teardownMedia() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      // Clear the shared references first so overlapping stop/playback paths
      // cannot close the same capture resources twice.
      const stream = micStream;
      const context = audioCtx;
      const source = sourceNode;
      micStream = null;
      audioCtx = null;
      sourceNode = null;
      analyser = null;

      if (source) {
        try { source.disconnect(); } catch (_) {}
      }
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (context && context.state !== 'closed') {
        try { await context.close(); } catch (_) {}
      }
    }

    async function resumeCaptureAfterPlayback() {
      if (!running || micStream) return;

      try {
        await openCapture();
      } catch (err) {
        if (!running) return;
        running = false;
        sessionBtn.classList.remove('running');
        sessionIcon.textContent = '▶';
        sessionLabel.textContent = 'Start session';
        setStatus('blocked');
        return;
      }

      // The user may stop the session while microphone access is reopening.
      if (!running) {
        await teardownMedia();
        return;
      }

      beginRecording();
      monitor();
    }

    function saveCurrentTake(recorder = mediaRecorder) {
      const type = (recorder && recorder.mimeType) || 'audio/webm';
      const blob = new Blob(chunks, { type });
      if (!hasSpoken || blob.size === 0) return;
      const duration = (performance.now() - recordStartTime) / 1000;
      return addToHistory(blob, type, duration);
    }

    function beginRecording() {
      // Arm first: wait for audio past the threshold before we actually start
      // recording, so each take starts at the moment of first speech.
      if (!running) return;
      chunks = [];
      hasSpoken = false;
      recordingFinalized = true;
      silenceStart = null;
      armed = true;
      recording = false;
      setPhaseProgress(0);
      setSilenceProgress(-1);
      setPhaseBloom(0);
      setStatus('listening');
    }

    function startActualRecording() {
      armed = false;
      hasSpoken = true;
      silenceStart = null;
      mediaRecorder = createHighQualityRecorder(micStream);
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };
      mediaRecorder.onstop = handleRecordingStop;
      recordingFinalized = false;
      mediaRecorder.start();
      recordStartTime = performance.now();
      recording = true;
      setStatus('recording');
    }

    function createHighQualityRecorder(stream) {
      const mimeTypes = [
        'audio/mp4;codecs=mp4a.40.2',
        'audio/webm;codecs=opus',
        'audio/mp4',
        'audio/webm',
        'audio/ogg;codecs=opus',
      ];
      const canCheckType = typeof MediaRecorder.isTypeSupported === 'function';
      const mimeType = canCheckType
        ? mimeTypes.find(type => MediaRecorder.isTypeSupported(type))
        : 'audio/mp4';
      const options = { audioBitsPerSecond: 192000 };
      if (mimeType) options.mimeType = mimeType;

      try {
        return new MediaRecorder(stream, options);
      } catch (err) {
        // Preserve recording on older browsers that reject bitrate options.
        return new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      }
    }

    async function handleRecordingStop() {
      recordingFinalized = true;
      if (!running) return;
      const type = mediaRecorder.mimeType || 'audio/webm';
      const blob = new Blob(chunks, { type });
      if (!hasSpoken || blob.size === 0) {
        // Nothing was said; just start a fresh take.
        beginRecording();
        return;
      }
      const duration = (performance.now() - recordStartTime) / 1000;
      addToHistory(blob, type, duration);

      // Fully release capture before playback. On iOS, leaving getUserMedia
      // active can keep output in a lower-quality duplex audio route.
      await teardownMedia();
      if (!running) return;
      playback(blob, duration);
    }

    function addToHistory(blob, type, duration) {
      takeNum++;
      const ext = type.includes('ogg') ? 'ogg' : (type.includes('mp4') ? 'mp4' : 'webm');
      const item = {
        id: Date.now() + '-' + takeNum,
        n: takeNum,
        name: '',
        url: URL.createObjectURL(blob),
        blob,
        duration,
        time: new Date(),
        ext,
        type,
        starred: false,
        archived: false,
        archivedAt: null,
      };
      history.unshift(item);
      pendingEnterId = item.id;
      renderHistory();
      const savePromise = Promise.all([saveClip(item), persistTakeNum()])
        .catch(err => {
          console.warn('Could not save recording to IndexedDB', err);
        });
      pendingTakeSaves.add(savePromise);
      const forgetSave = () => pendingTakeSaves.delete(savePromise);
      savePromise.then(forgetSave, forgetSave);
      return savePromise;
    }

    async function waitForPendingTakeSaves() {
      while (pendingTakeSaves.size > 0) {
        await Promise.all(Array.from(pendingTakeSaves));
      }
    }

    function fmtDuration(s) {
      if (!isFinite(s) || s < 0) s = 0;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    function fmtTimestamp(value, now = new Date()) {
      const date = value instanceof Date ? value : new Date(value);
      if (!isFinite(date.getTime())) return '';

      const time = date.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
      });
      const calendarDay = current => Date.UTC(
        current.getFullYear(),
        current.getMonth(),
        current.getDate()
      );
      const daysAgo = (calendarDay(now) - calendarDay(date)) / (24 * 60 * 60 * 1000);

      if (daysAgo >= 0 && daysAgo < 7) {
        const relativeDay = daysAgo === 0
          ? 'Today'
          : daysAgo === 1
            ? 'Yesterday'
            : date.toLocaleDateString('en-US', { weekday: 'long' });
        return relativeDay + ', ' + time;
      }

      const dateParts = date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        ...(date.getFullYear() === now.getFullYear() ? {} : { year: 'numeric' }),
      });
      return dateParts + ', ' + time;
    }

    function clipTitle(item) {
      const name = (item.name || '').trim();
      return name || ('Take ' + item.n);
    }

    function sanitizeFilename(name) {
      return String(name || '')
        .trim()
        .replace(/[\\/:*?"<>|]+/g, '-')
        .replace(/\s+/g, ' ')
        .slice(0, 80) || 'take';
    }

    function visibleHistory() {
      let items = history.slice();
      if (historyFilter === 'archived') {
        items = items.filter(i => i.archived);
      } else if (historyFilter === 'keepers') {
        items = items.filter(i => i.starred && !i.archived);
      } else {
        items = items.filter(i => !i.archived);
      }
      return items.sort((a, b) => {
        const tb = b.time instanceof Date ? b.time.getTime() : Number(b.time) || 0;
        const ta = a.time instanceof Date ? a.time.getTime() : Number(a.time) || 0;
        if (tb !== ta) return tb - ta;
        return (b.n || 0) - (a.n || 0);
      });
    }

    function svgIcon(paths) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = paths;
      return svg;
    }

    const ICONS = {
      download: '<path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/>',
      archive: '<path d="M4 7h16"/><path d="M6 7v11a2 2 0 002 2h8a2 2 0 002-2V7"/><path d="M9 11h6"/><path d="M10 4h4l1 3H9l1-3z"/>',
      unarchive: '<path d="M4 7h16"/><path d="M6 7v11a2 2 0 002 2h8a2 2 0 002-2V7"/><path d="M12 17V11"/><path d="M9 13l3-3 3 3"/><path d="M10 4h4l1 3H9l1-3z"/>',
      trash: '<path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/>',
    };

    function makeIconBtn(className, title, iconKey) {
      const btn = document.createElement('button');
      btn.className = 'clip__btn' + (className ? ' ' + className : '');
      btn.title = title;
      btn.appendChild(svgIcon(ICONS[iconKey]));
      return btn;
    }

    function toggleStar(item) {
      item.starred = !item.starred;
      renderHistory();
      saveClip(item).catch(err => {
        console.warn('Could not update star in IndexedDB', err);
      });
    }

    function toggleArchive(item) {
      item.archived = !item.archived;
      item.archivedAt = item.archived ? new Date() : null;
      if (historyAudio && nowPlayingEl && nowPlayingEl.dataset.id === item.id) {
        stopHistoryPlayback();
      }
      renderHistory();
      saveClip(item).catch(err => {
        console.warn('Could not update archive in IndexedDB', err);
      });
    }

    function askConfirm(message, confirmLabel) {
      return new Promise(resolve => {
        confirmMsg.textContent = message;
        confirmOk.textContent = confirmLabel || 'Delete';
        confirmDialog.hidden = false;
        confirmOk.focus();

        const finish = (ok) => {
          confirmDialog.hidden = true;
          confirmOk.removeEventListener('click', onOk);
          confirmCancel.removeEventListener('click', onCancel);
          confirmBackdrop.removeEventListener('click', onCancel);
          document.removeEventListener('keydown', onKey);
          resolve(ok);
        };
        const onOk = () => finish(true);
        const onCancel = () => finish(false);
        const onKey = (e) => {
          if (e.key === 'Escape') finish(false);
          if (e.key === 'Enter') finish(true);
        };

        confirmOk.addEventListener('click', onOk);
        confirmCancel.addEventListener('click', onCancel);
        confirmBackdrop.addEventListener('click', onCancel);
        document.addEventListener('keydown', onKey);
      });
    }

    async function removeTake(item) {
      const ok = await askConfirm(
        'Delete "' + clipTitle(item) + '"? This cannot be undone.',
        'Delete'
      );
      if (!ok) return;

      if (historyAudio && nowPlayingEl && nowPlayingEl.dataset.id === item.id) {
        stopHistoryPlayback();
      }
      URL.revokeObjectURL(item.url);
      const idx = history.findIndex(h => h.id === item.id);
      if (idx >= 0) history.splice(idx, 1);
      selectedTakeIds.delete(item.id);
      if (history.length === 0) takeNum = 0;
      renderHistory();
      Promise.all([deleteClip(item.id), persistTakeNum()]).catch(err => {
        console.warn('Could not delete take from IndexedDB', err);
      });
    }

    function startRename(item, titleEl) {
      if (titleEl.parentElement.querySelector('.clip__rename')) return;

      const row = titleEl.closest('.clip');
      if (row) row.classList.add('clip--renaming');

      const input = document.createElement('input');
      input.className = 'clip__rename';
      input.type = 'text';
      input.maxLength = 80;
      input.value = (item.name || '').trim() || ('Take ' + item.n);
      input.setAttribute('aria-label', 'Rename take');

      let finished = false;
      const finish = (save) => {
        if (finished) return;
        finished = true;
        if (save) {
          const next = input.value.trim();
          const fallback = 'Take ' + item.n;
          item.name = (!next || next === fallback) ? '' : next;
          saveClip(item).catch(err => {
            console.warn('Could not save rename to IndexedDB', err);
          });
        }
        titleEl.textContent = clipTitle(item);
        input.replaceWith(titleEl);
        if (row) row.classList.remove('clip--renaming');
      };

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finish(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
    }

    function selectedVisibleTakes() {
      return visibleHistory().filter(item => selectedTakeIds.has(item.id));
    }

    function setHistorySelecting(selecting) {
      historySelecting = selecting;
      selectedTakeIds.clear();
      if (selecting && historyAudio) stopHistoryPlayback();
      renderHistory();
    }

    function toggleTakeSelection(item) {
      if (selectedTakeIds.has(item.id)) {
        selectedTakeIds.delete(item.id);
      } else {
        selectedTakeIds.add(item.id);
      }
      renderHistory();
    }

    async function archiveSelectedTakes() {
      const selected = selectedVisibleTakes();
      if (selected.length === 0) return;

      const restoring = historyFilter === 'archived';
      const now = new Date();
      selected.forEach(item => {
        item.archived = !restoring;
        item.archivedAt = restoring ? null : now;
        if (historyAudio && nowPlayingEl && nowPlayingEl.dataset.id === item.id) {
          stopHistoryPlayback();
        }
      });

      setHistorySelecting(false);
      try {
        await Promise.all(selected.map(item => saveClip(item)));
      } catch (err) {
        console.warn('Could not update selected takes in IndexedDB', err);
      }
    }

    async function deleteSelectedTakes() {
      const selected = selectedVisibleTakes();
      if (selected.length === 0) return;

      const keeperCount = selected.filter(item => item.starred).length;
      const takeLabel = selected.length === 1 ? 'take' : 'takes';
      const keeperWarning = keeperCount > 0
        ? ' Includes ' + keeperCount + ' ' + (keeperCount === 1 ? 'keeper' : 'keepers') + '.'
        : '';
      const ok = await askConfirm(
        'Permanently delete ' + selected.length + ' selected ' + takeLabel + '?' +
          keeperWarning + ' This cannot be undone.',
        'Delete ' + selected.length
      );
      if (!ok) return;

      const selectedIds = new Set(selected.map(item => item.id));
      if (historyAudio && nowPlayingEl && selectedIds.has(nowPlayingEl.dataset.id)) {
        stopHistoryPlayback();
      }
      selected.forEach(item => URL.revokeObjectURL(item.url));
      for (let i = history.length - 1; i >= 0; i--) {
        if (selectedIds.has(history[i].id)) history.splice(i, 1);
      }
      if (history.length === 0) takeNum = 0;

      historySelecting = false;
      selectedTakeIds.clear();
      renderHistory();
      try {
        await Promise.all(selected.map(item => deleteClip(item.id)));
        await persistTakeNum();
      } catch (err) {
        console.warn('Could not delete selected takes from IndexedDB', err);
      }
    }

    function renderHistory() {
      const active = history.filter(i => !i.archived);
      const archived = history.filter(i => i.archived);
      const starredActive = active.filter(i => i.starred);
      const items = visibleHistory();
      const historyIds = new Set(history.map(item => item.id));
      selectedTakeIds.forEach(id => {
        if (!historyIds.has(id)) selectedTakeIds.delete(id);
      });

      const hasTakes = history.length > 0;
      historySection.hidden = !hasTakes;
      cardEl.classList.toggle('has-history', hasTakes);

      if (!hasTakes) {
        historyList.innerHTML = '';
        nowPlayingEl = null;
        historyFilter = 'active';
        historySelecting = false;
        selectedTakeIds.clear();
        selectionHead.hidden = true;
        bulkBar.hidden = true;
        return;
      }

      const count = historyFilter === 'archived'
        ? archived.length
        : historyFilter === 'keepers'
          ? starredActive.length
          : active.length;
      historyCount.textContent = '(' + count + ')';
      historyTitle.textContent = historyFilter === 'archived'
        ? 'Archived'
        : historyFilter === 'keepers'
          ? 'Keepers'
          : 'History';

      keepersBtn.classList.toggle('on', historyFilter === 'keepers');
      keepersBtn.setAttribute('aria-pressed', String(historyFilter === 'keepers'));
      keepersBtn.title = historyFilter === 'keepers' ? 'Show all takes' : 'Show keepers only';
      keepersBtn.setAttribute('aria-label', keepersBtn.title);
      keepersBtn.hidden = historyFilter === 'archived';
      keepersBtn.disabled = starredActive.length === 0 && historyFilter !== 'keepers';
      archivedBtn.disabled = archived.length === 0 && historyFilter !== 'archived';
      archivedBtn.textContent = historyFilter === 'archived'
        ? 'Back to history'
        : 'Archived (' + archived.length + ')';
      archivedBtn.title = historyFilter === 'archived'
        ? 'Leave archived view'
        : 'Show archived takes';

      selectModeBtn.classList.toggle('on', historySelecting);
      selectModeBtn.setAttribute('aria-pressed', String(historySelecting));
      selectModeBtn.title = historySelecting ? 'Finish selecting' : 'Select takes';
      selectModeBtn.setAttribute('aria-label', selectModeBtn.title);
      selectModeBtn.disabled = items.length === 0;

      const selected = items.filter(item => selectedTakeIds.has(item.id));
      const allShownSelected = items.length > 0 && selected.length === items.length;
      selectionHead.hidden = !historySelecting || items.length === 0;
      bulkBar.hidden = !historySelecting || items.length === 0;
      selectAllBtn.textContent = allShownSelected ? 'Clear selection' : 'Select all shown';
      selectedCount.textContent = selected.length + ' selected';
      bulkArchiveBtn.textContent = historyFilter === 'archived' ? 'Restore' : 'Archive';
      bulkArchiveBtn.disabled = selected.length === 0;
      bulkDeleteBtn.disabled = selected.length === 0;

      if (items.length === 0) {
        const emptyMsg = historyFilter === 'keepers'
          ? 'No starred keepers yet.'
          : historyFilter === 'archived'
            ? 'No archived takes.'
            : 'No recordings yet.';
        historyList.innerHTML = '<div class="history__empty">' + emptyMsg + '</div>';
        nowPlayingEl = null;
        return;
      }

      historyList.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        const isSelected = selectedTakeIds.has(item.id);
        row.className = 'clip' +
          (item.starred ? ' starred' : '') +
          (historySelecting ? ' selecting' : '') +
          (isSelected ? ' selected' : '');
        if (item.id === pendingEnterId) {
          row.classList.add('clip--enter');
          pendingEnterId = null;
        }
        row.dataset.id = item.id;

        const leadingBtn = document.createElement('button');
        if (historySelecting) {
          leadingBtn.className = 'clip__select';
          leadingBtn.textContent = '✓';
          leadingBtn.title = isSelected ? 'Deselect ' + clipTitle(item) : 'Select ' + clipTitle(item);
          leadingBtn.setAttribute('aria-pressed', String(isSelected));
        } else {
          leadingBtn.className = 'clip__play';
          leadingBtn.textContent = '▶';
          leadingBtn.title = 'Play';
        }

        const meta = document.createElement('div');
        meta.className = 'clip__meta';

        const titleEl = document.createElement('div');
        titleEl.className = 'clip__title';
        titleEl.textContent = clipTitle(item);
        titleEl.title = historySelecting ? '' : 'Click to rename';

        const subEl = document.createElement('div');
        subEl.className = 'clip__sub';
        subEl.textContent = fmtDuration(item.duration) + ' · ' + fmtTimestamp(item.time);

        meta.appendChild(titleEl);
        meta.appendChild(subEl);

        if (historySelecting) {
          const selectItem = () => toggleTakeSelection(item);
          leadingBtn.addEventListener('click', e => {
            e.stopPropagation();
            selectItem();
          });
          row.addEventListener('click', selectItem);
        } else {
          leadingBtn.addEventListener('click', () => playClip(item, row, leadingBtn));
          titleEl.addEventListener('click', () => startRename(item, titleEl));
        }

        row.appendChild(leadingBtn);
        row.appendChild(meta);

        if (historySelecting) {
          const keeperMark = document.createElement('span');
          keeperMark.className = 'clip__keeper-mark';
          keeperMark.textContent = item.starred ? '★' : '';
          keeperMark.setAttribute('aria-label', item.starred ? 'Keeper' : '');
          row.appendChild(keeperMark);
        } else {
          const actions = document.createElement('div');
          actions.className = 'clip__actions';

          const more = document.createElement('div');
          more.className = 'clip__more';

          const archiveBtn = makeIconBtn(
            'archive' + (item.archived ? ' on' : ''),
            item.archived ? 'Unarchive' : 'Archive',
            item.archived ? 'unarchive' : 'archive'
          );
          const delBtn = makeIconBtn('danger', 'Delete', 'trash');

          const starBtn = document.createElement('button');
          starBtn.className = 'clip__btn primary star' + (item.starred ? ' on' : '');
          starBtn.textContent = item.starred ? '★' : '☆';
          starBtn.title = item.starred ? 'Unstar keeper' : 'Star as keeper';

          const dlBtn = makeIconBtn('primary', 'Download', 'download');

          starBtn.addEventListener('click', () => toggleStar(item));
          archiveBtn.addEventListener('click', () => toggleArchive(item));
          delBtn.addEventListener('click', () => removeTake(item));
          dlBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = item.url;
            a.download = sanitizeFilename(clipTitle(item)) + '.' + item.ext;
            a.click();
          });

          more.appendChild(archiveBtn);
          more.appendChild(delBtn);
          actions.appendChild(more);
          actions.appendChild(starBtn);
          actions.appendChild(dlBtn);
          row.appendChild(actions);
        }
        historyList.appendChild(row);
      });
    }

    function clearLoopProgress() {
      if (loopProgressRaf) {
        cancelAnimationFrame(loopProgressRaf);
        loopProgressRaf = null;
      }
    }

    function resetMeterFromPlayback() {
      resetPhaseVisual();
    }

    function stopHistoryPlayback({ resumeMetronome = true } = {}) {
      if (!historyAudio) return;
      const audio = historyAudio;
      const row = nowPlayingEl;
      historyAudio = null;
      nowPlayingEl = null;
      audio.onended = null;
      audio.onpause = null;
      audio.onerror = null;
      try { audio.pause(); } catch (_) {}
      if (row) {
        row.classList.remove('playing');
        const btn = row.querySelector('.clip__play');
        if (btn) {
          btn.textContent = '▶';
          btn.title = 'Play';
        }
      }
      if (resumeMetronome) resumeMetronomeAfterPlayback();
    }

    function stopLoopPlayback({ resumeListening = false, resumeMetronome = true } = {}) {
      clearLoopProgress();
      const wasPlaying = !!loopAudio;

      if (loopAudio) {
        const audio = loopAudio;
        loopAudio = null;
        audio.onended = null;
        audio.onerror = null;
        try { audio.pause(); } catch (_) {}
      }
      if (loopUrl) {
        URL.revokeObjectURL(loopUrl);
        loopUrl = null;
      }
      resetMeterFromPlayback();
      setPhasePlaybackInteractive(false);

      if (wasPlaying && resumeMetronome) resumeMetronomeAfterPlayback();

      if (resumeListening && running && !recording && !armed) {
        resumeCaptureAfterPlayback();
      }
    }

    function skipLoopPlayback() {
      if (!loopAudio) return;
      stopLoopPlayback({ resumeListening: true });
    }

    function startLoopProgress(audio, measuredDuration) {
      clearLoopProgress();
      const totalFallback = measuredDuration || 0;
      const total = () => (isFinite(audio.duration) && audio.duration > 0)
        ? audio.duration : totalFallback;

      const updateProgress = () => {
        if (!loopAudio) return;
        const t = total();
        const pct = t > 0 ? Math.min(100, (audio.currentTime / t) * 100) : 0;
        setPhaseProgress(pct);
        setPhaseMeta(fmtDuration(audio.currentTime) + ' / ' + fmtDuration(t));
        loopProgressRaf = requestAnimationFrame(updateProgress);
      };
      loopProgressRaf = requestAnimationFrame(updateProgress);
    }

    async function playClip(item, row, playBtn) {
      // Toggle off if this clip is already playing.
      if (historyAudio && nowPlayingEl === row) {
        historyPlayRequest++;
        stopHistoryPlayback();
        return;
      }

      const request = ++historyPlayRequest;

      // Historical playback pauses the session. This also finalizes the current
      // recording and waits for every pending take to reach IndexedDB.
      if (running || sessionStopPromise) {
        await stop({ pauseMetronome: false });
        if (request !== historyPlayRequest) return;
      } else {
        stopLoopPlayback({ resumeListening: false, resumeMetronome: false });
      }

      stopHistoryPlayback({ resumeMetronome: false });
      pauseMetronomeForPlayback();

      // Saving an in-progress take re-renders history, so target the current row.
      row = Array.from(historyList.querySelectorAll('.clip'))
        .find(candidate => candidate.dataset.id === item.id) || row;
      playBtn = row.querySelector('.clip__play') || playBtn;

      const audio = new Audio(item.url);
      historyAudio = audio;
      nowPlayingEl = row;
      row.classList.add('playing');
      playBtn.textContent = '❚❚';
      playBtn.title = 'Stop';

      const reset = () => {
        if (historyAudio !== audio) return;
        stopHistoryPlayback();
      };
      audio.onended = reset;
      audio.onerror = reset;
      audio.play().catch(reset);
    }

    function setMenuOpen(open) {
      menuDropdown.classList.toggle('open', open);
      menuDropdown.hidden = !open;
      menuBtn.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
    }

    menuBtn.addEventListener('click', e => {
      e.stopPropagation();
      setMenuOpen(menuDropdown.hidden);
    });

    document.addEventListener('click', e => {
      if (!menuDropdown.hidden && !document.getElementById('historyMenu').contains(e.target)) {
        setMenuOpen(false);
      }
    });

    keepersBtn.addEventListener('click', () => {
      historyFilter = historyFilter === 'keepers' ? 'active' : 'keepers';
      setMenuOpen(false);
      setHistorySelecting(false);
    });

    archivedBtn.addEventListener('click', () => {
      historyFilter = historyFilter === 'archived' ? 'active' : 'archived';
      setMenuOpen(false);
      setHistorySelecting(false);
    });

    selectModeBtn.addEventListener('click', () => {
      setMenuOpen(false);
      setHistorySelecting(!historySelecting);
    });

    selectAllBtn.addEventListener('click', () => {
      const items = visibleHistory();
      const allShownSelected = items.length > 0 && items.every(item => selectedTakeIds.has(item.id));
      if (allShownSelected) {
        items.forEach(item => selectedTakeIds.delete(item.id));
      } else {
        items.forEach(item => selectedTakeIds.add(item.id));
      }
      renderHistory();
    });

    bulkArchiveBtn.addEventListener('click', archiveSelectedTakes);
    bulkDeleteBtn.addEventListener('click', deleteSelectedTakes);

    phaseEl.addEventListener('click', () => {
      if (loopAudio) skipLoopPlayback();
    });
    phaseEl.addEventListener('keydown', (e) => {
      if (!loopAudio) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        skipLoopPlayback();
      }
    });

    initStorage();

    function playback(blob, measuredDuration) {
      // Auto playback cuts off any history take.
      stopHistoryPlayback();
      stopLoopPlayback({ resumeListening: false });
      pauseMetronomeForPlayback();

      recording = false;
      loopMeasuredDuration = measuredDuration || 0;
      setStatus('playing');

      setPhaseProgress(0);
      setSilenceProgress(-1);
      setPhaseBloom(55);
      setPhaseMeta('0:00');

      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      loopUrl = url;
      loopAudio = audio;

      startLoopProgress(audio, loopMeasuredDuration);

      const finish = () => {
        if (loopAudio !== audio) return;
        stopLoopPlayback({ resumeListening: true });
      };

      audio.onended = finish;
      audio.onerror = finish;
      audio.play().catch(() => {
        finish();
      });
    }

    function monitor() {
      const data = new Uint8Array(analyser.fftSize);

      const tick = () => {
        if (!running) return;
        rafId = requestAnimationFrame(tick);

        analyser.getByteTimeDomainData(data);
        // Compute RMS volume (0..1)
        let sumSq = 0;
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;
          sumSq += v * v;
        }
        const rms = Math.sqrt(sumSq / data.length);
        const levelPct = Math.min(100, Math.round(rms * 300));
        const threshPct = Number(threshSlider.value);

        // Drive the phase ring + waveform while listening (armed) or recording.
        if (armed || recording) {
          setPhaseProgress(levelPct);
          setPhaseBloom(levelPct);
          drawWaveform(data);

          const isLoud = levelPct >= threshPct;

          if (armed) {
            setSilenceProgress(-1);
            // Waiting for the first sound past the threshold to begin recording.
            if (isLoud) startActualRecording();
          } else if (recording) {
            if (isLoud) {
              silenceStart = null;
              setSilenceProgress(-1);
            } else {
              // Silence after speech — stay in Recording visually; drain the arc.
              if (silenceStart === null) silenceStart = performance.now();
              const silencePct = ((performance.now() - silenceStart) / Number(durSlider.value)) * 100;
              setSilenceProgress(Math.min(100, silencePct));
              if (silencePct >= 100) {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                  recording = false;
                  mediaRecorder.stop();
                }
              }
            }
          }
        } else {
          clearWaveform();
        }
      };
      tick();
    }
  </script>
